limit_req_zone $binary_remote_addr zone=admin_api:10m rate=10r/s;
server { listen 80; listen [::]:80; server_name sync.example.com; return 301 https://$host$request_uri; }
server {
  listen 443 ssl http2; listen [::]:443 ssl http2; server_name sync.example.com;
  ssl_certificate /etc/letsencrypt/live/sync.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sync.example.com/privkey.pem;
  client_max_body_size 10m; gzip on; gzip_types application/json text/css application/javascript;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always;
  location /api/admin/ { limit_req zone=admin_api burst=20 nodelay; proxy_pass http://127.0.0.1:3000; include proxy_params; }
  location / { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 60s; proxy_send_timeout 60s; }
}
